<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Visit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    #scroll-driver {
      position: relative;
    }

    #stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      display: block;
      object-fit: cover;
      /* Ensures image fills screen nicely on all aspect ratios */
    }

    #progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 4px;
      width: 0%;
      background: #00ffcc;
      z-index: 50;
      transition: width 0.1s ease-out;
    }

    /* Added a loading overlay so users don't scroll an empty black screen */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #00ffcc;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loader-logo {
      width: 220px;
      max-width: 55vw;
      height: auto;
      margin-bottom: 28px;
    }

    #load-text {
      font-size: 17px;
      letter-spacing: 0.03em;
    }

    /* ── Message "scrollez pour vous déplacer" ─────────────────── */
    #scroll-hint {
      position: fixed;
      left: 50%;
      top: 36px;
      transform: translate(-50%, 0);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;

      color: #ffffff;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);

      opacity: 0;
      pointer-events: none;
      z-index: 60;

      transition: opacity 0.6s ease;
    }

    #scroll-hint.visible {
      opacity: 1;
    }

    #scroll-hint .scroll-hint-arrow {
      animation: scroll-hint-bounce 1.6s ease-in-out infinite;
    }

    @keyframes scroll-hint-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(6px); opacity: 1; }
    }

    /* loupe icon */
    #zoom-icon {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;


      opacity: 0;
      pointer-events: none;

      transition: opacity .3s ease;
      z-index: 9999;
    }

    #zoom-icon img {
      width: 800%;
      height: 800%;
    }

    #zoom-icon.visible {
      opacity: 1;

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.15);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }

    }


    /* play icon css */

    #play-icon {
      position: fixed;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      font-size: 80px;
      color: white;

      opacity: 0;
      pointer-events: none;

      transition: opacity .3s;

      z-index: 1000;
    }

    #play-icon.visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    /* play icon css */

    #play-icon-1 {
      position: fixed;
      left: 35%;
      top: 30%;

      transform: translate(-50%, -50%);

      font-size: 80px;
      color: white;

      opacity: 0;
      pointer-events: none;

      transition: opacity .3s;

      z-index: 1000;
    }

    #play-icon-1 img {
      width: 50%;
      height: 500%;
    }

    #play-icon-1.visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }


    /* video overlay */
    #video-overlay {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, .85);

      opacity: 0;
      visibility: hidden;

      transition: .3s;

      z-index: 2000;
    }

    #video-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    #scene-video {
      width: min(1200px, 90vw);
      max-height: 85vh;
    }

    #scene-video-1 {
      display: none;
    }

    #close-video {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    #bike-btn{
      position: fixed;

      left: 50%;
      top: 50%;
      bottom: auto;

      transform: translate(-50%, -50%);

      display: none;
      align-items: center;
      gap: 8px;

      padding: 11px 22px;

      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;

      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;

      background: rgba(17, 17, 17, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: #ffffff;

      cursor: pointer;

      z-index: 1500;

      animation: bike-btn-pulse 2.6s ease-in-out infinite;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  #bike-btn:hover{
        background: rgba(0, 255, 204, 0.16);
        border-color: rgba(0, 255, 204, 0.55);
        transform: translate(-50%, calc(-50% - 2px));
    }

    @keyframes bike-btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.3); }
      50% { box-shadow: 0 0 0 7px rgba(0, 255, 204, 0); }
    }

    #exit-bike-btn {

      position: fixed;

      top:30px;
      right:30px;

      width:50px;
      height:50px;

      border-radius:50%;

      background:white;

      border:none;

      font-size:25px;

      cursor:pointer;

      display:none;

      z-index:2000;
  }

    /* ── Annotations (points d'intérêt) ──────────────────────────
       #annotations-layer reste vide dans le HTML : chaque annotation
       (.legend) est générée dynamiquement par main.js à partir du
       tableau ANNOTATIONS.                                          */

    #annotations-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 20;
    }

    .legend {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
    }

    /* ancre invisible, déplacée en JS sur le point tracké */
    .legend .legend-anchor {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
    }

    /* le point posé sur l'élément suivi */
    .legend .legend-dot {
        position: absolute;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25), 0 0 10px rgba(255, 255, 255, 0.8);
        opacity: 0;
        transform: scale(0);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* segment diagonal, part du point vers le texte */
    .legend .legend-diag {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--diag-length, 71px);
        height: 1px;
        background: #ffffff;
        transform-origin: left center;
        transform: rotate(var(--angle, -39deg)) scaleX(0);
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.25s ease;
    }

    /* petit trait horizontal qui souligne le texte
       (largeur/position/transform-origin posés en JS selon la direction) */
    .legend .legend-underline {
        position: absolute;
        background: #ffffff;
        height: 1px;
        transform: scaleX(0);
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.25s ease;
    }

    /* le texte de la légende
       (position/alignement posés en JS selon la direction) */
    .legend .legend-label {
        position: absolute;
        color: #ffffff;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .legend .legend-label[data-align="right"] {
        transform: translateX(-100%) translateY(6px);
    }

    /* ── Apparition en cascade ── */
    .legend.visible .legend-dot {
        opacity: 1;
        transform: scale(1);
        transition-delay: 0s;
    }

    .legend.visible .legend-diag {
        opacity: 1;
        transform: rotate(var(--angle, -39deg)) scaleX(1);
        transition-delay: 0.15s;
    }

    .legend.visible .legend-underline {
        opacity: 1;
        transform: scaleX(1);
        transition-delay: 0.3s;
    }

    .legend.visible .legend-label {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.4s;
    }

    .legend.visible .legend-label[data-align="right"] {
        transform: translateX(-100%) translateY(0);
    }

  </style>
</head>

<body>

  <div id="loader">
    <img src="assets/images/logo.png" alt="Logo" class="loader-logo">
    <div class="spinner"></div>

  </div>

  <div id="scroll-hint">

      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>

  <div id="scroll-driver">
    <canvas id="stage"></canvas>
  </div>
