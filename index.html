<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMADA STUDIOS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
        }

        header {
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.2rem;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px 80px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .project {
            background: #1d1d1d;
            border-radius: 16px;
            overflow: hidden;
            transition: .3s;
        }

        .project:hover {
            transform: translateY(-6px);
        }

        .thumbnail {
            height: 220px;
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }


        .content {
            padding: 24px;
        }

        .content h2 {
            margin-bottom: 12px;
        }

        .content p {
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            background: white;
            color: black;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #ddd;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>ARMADA STUDIOS</h1>
    <p class="subtitle">
        Interactive experiences, data stories & creative web experiments.
    </p>
</header>

<main>

    <section class="projects">

        <article class="project">

            <div class="thumbnail">
                 <img src="test_scrollytelling/frames/main_path/0001_composite.png" alt="scrollytelling">
            </div>

            <div class="content">
                <h2>Test Scrollytelling</h2>

                <p>
                    Prototype de narration interactive utilisant le scrolling,
                    animations et visualisations.
                </p>

                <a class="button" href="test_scrollytelling/">
                    Découvrir →
                </a>

            </div>

        </article>

    </section>

</main>

<footer>
    © 2026 ARMADA STUDIOS
</footer>

</body>
</html>
